<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUS WORK - Anúncios e Eventos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #090C10; color: #FFFFFF; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-6">

  <header class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
    <div class="flex items-center gap-4">
      <a href="06_tela_inicial.html" class="text-gray-400 hover:text-[#FFD600]"><i data-lucide="arrow-left"></i></a>
      <h1 class="text-2xl font-black text-white">Quadro de Anúncios e Eventos</h1>
    </div>
    <div class="bg-[#FFD600] text-black font-bold px-4 py-2 rounded-xl text-sm">
      <i data-lucide="calendar" class="inline w-4 h-4 mr-1"></i> Campo Mourão
    </div>
  </header>

  <main class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    
    <!-- Anúncio 1 -->
    <div class="bg-[#0D1117] border border-gray-800 rounded-2xl overflow-hidden hover:border-[#FFD600] transition">
      <img src="assets/empreende_week_2026.jpeg" alt="Empreende Week" class="w-full h-48 object-cover">
      <div class="p-4 space-y-2">
        <span class="bg-blue-600/30 text-blue-400 text-[10px] font-bold px-2 py-1 rounded-full">Inovação & Tech</span>
        <h3 class="font-bold text-lg">Empreende Week Summit</h3>
        <p class="text-xs text-gray-400"><i data-lucide="calendar" class="w-3 h-3 inline"></i> 05 a 07 de Outubro</p>
        <button class="w-full bg-[#FFD600] text-black font-bold py-2 rounded-xl mt-2 text-sm">Garantir Vaga</button>
      </div>
    </div>

    <!-- Anúncio 2 -->
    <div class="bg-[#0D1117] border border-gray-800 rounded-2xl overflow-hidden hover:border-[#FFD600] transition">
      <img src="assets/festival_musica.jpeg" alt="Festival de Música" class="w-full h-48 object-cover">
      <div class="p-4 space-y-2">
        <span class="bg-purple-600/30 text-purple-400 text-[10px] font-bold px-2 py-1 rounded-full">Música</span>
        <h3 class="font-bold text-lg">10º Festival de Música</h3>
        <p class="text-xs text-gray-400"><i data-lucide="calendar" class="w-3 h-3 inline"></i> 14 a 19 de Setembro</p>
        <button class="w-full bg-[#FFD600] text-black font-bold py-2 rounded-xl mt-2 text-sm">Ver Programação</button>
      </div>
    </div>

    <!-- Anúncio 3 -->
    <div class="bg-[#0D1117] border border-gray-800 rounded-2xl overflow-hidden hover:border-[#FFD600] transition">
      <img src="assets/recital_inverno_folclore.jpeg" alt="Recital de Inverno" class="w-full h-48 object-cover">
      <div class="p-4 space-y-2">
        <span class="bg-red-600/30 text-red-400 text-[10px] font-bold px-2 py-1 rounded-full">Folclore</span>
        <h3 class="font-bold text-lg">Recital de Inverno</h3>
        <p class="text-xs text-gray-400"><i data-lucide="calendar" class="w-3 h-3 inline"></i> 03 e 04 de Julho</p>
        <button class="w-full bg-[#FFD600] text-black font-bold py-2 rounded-xl mt-2 text-sm">Comprar Ingresso</button>
      </div>
    </div>

  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
